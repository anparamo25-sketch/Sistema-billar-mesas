name: Build Billares Don Miguel Update APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Crear proyecto Android con el mismo identificador de la app instalada
        run: flutter create --platforms=android --org com.billaresdonmiguel --project-name billares_don_miguel .

      - name: Restaurar integración nativa de TV
        run: |
          set -e
          test -f android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          git checkout -- android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          grep -F 'billar_control/tv' android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt

      - name: Configurar Android
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />')
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="billares_don_miguel"', 'android:label="Billares Don Miguel"')
          manifest.write_text(s)
          PY

      - name: Dependencias
        run: flutter pub get

      - name: Formatear y analizar
        run: |
          set -e
          rm -f test/widget_test.dart
          dart format lib
          flutter analyze --no-fatal-infos

      - name: Validar reglas del sistema
        run: |
          set -e
          grep -F "const rates = <double>[120, 120, 100, 100, 70];" lib/main.dart
          grep -F "const defaultPin = '1234';" lib/main.dart
          grep -F "void main()" lib/main.dart
          grep -F "MethodChannel('billar_control/tv')" lib/main.dart
          grep -F 'billar_control/tv' android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          grep -F '"startTv"' android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          grep -F '"updateTv"' android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          grep -F 'container.post' android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          echo "VALIDACION OK"

      - name: Compilar APK release 122
        run: flutter build apk --release --no-shrink --build-name=1.2.1 --build-number=122

      - name: Preparar APK público de actualización
        run: |
          set -e
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Billares-Don-Miguel-latest.apk
          sha256sum dist/Billares-Don-Miguel-latest.apk > dist/SHA256SUMS.txt

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-Update-v1.2.1-build122-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release público
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1-build122-run${{ github.run_number }}
          name: Billares Don Miguel v1.2.1 (build 122)
          generate_release_notes: true
          files: dist/Billares-Don-Miguel-latest.apk
