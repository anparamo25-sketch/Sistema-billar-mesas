name: Build Billar Control Pro
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Crear proyecto Flutter Android limpio
        run: flutter create --project-name=billar_control_pro --platforms=android /tmp/billar_app
      - name: Copiar código
        run: |
          cp lib/main.dart /tmp/billar_app/lib/main.dart
          cp pubspec.yaml /tmp/billar_app/pubspec.yaml
      - name: Configurar permisos de red
        working-directory: /tmp/billar_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.INTERNET' not in s:
              s=s.replace(marker,marker+'\n    <uses-permission android:name="android.permission.INTERNET" />')
          if 'android.permission.ACCESS_NETWORK_STATE' not in s:
              s=s.replace(marker,marker+'\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />')
          if 'android:usesCleartextTraffic' not in s:
              s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          p.write_text(s)
          PY
      - name: Preparar dependencias
        working-directory: /tmp/billar_app
        run: |
          rm -f test/widget_test.dart
          flutter pub get
          dart format --output=none lib/main.dart
          flutter analyze --no-fatal-infos
      - name: Validar reglas
        working-directory: /tmp/billar_app
        run: |
          grep -F "const rates = <double>[120, 120, 100, 100, 70];" lib/main.dart
          grep -F "void main() {" lib/main.dart
          grep -F "PIN de administrador" lib/main.dart
          echo "VALIDACION OK"
      - name: Compilar APK release
        working-directory: /tmp/billar_app
        run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: billar-control-pro-apk-nuevo
          path: /tmp/billar_app/build/app/outputs/flutter-apk/app-release.apk
