name: Build Billares Don Miguel Update APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Generar estructura Android y preservar TV
        run: |
          set -e
          mkdir -p /tmp/billares-tv
          cp android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt /tmp/billares-tv/MainActivity.kt
          flutter create --platforms=android --org com.billaresdonmiguel .
          mkdir -p android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel
          cp /tmp/billares-tv/MainActivity.kt android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          test -f android/app/build.gradle.kts
      - name: Configurar Android
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36').replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"').replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />')
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(s)
          PY
      - name: Preparar version 1.2.3 build 123 y TV por red
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('const currentBuild = 122;', 'const currentBuild = 123;').replace("const currentVersion = '1.2.2';", "const currentVersion = '1.2.3';")
          s = s.replace("title: 'Billar Control Pro'", "title: 'Billares-Don-Miguel'")
          s = s.replace("..write('Billar Control Pro')", "..write('Billares-Don-Miguel')")
          marker = "  Future<void> startServer() async {"
          start = s.index(marker)
          end = s.index("\n  void updateTotals()", start)
          receiver = r'''  Future<void> startServer() async {
    try {
      server = await HttpServer.bind(InternetAddress.anyIPv4, port, shared: true);
      server!.listen((r) async {
        if (r.uri.path == '/state') {
          r.response.headers.contentType = ContentType.json;
          r.response.headers.set('Cache-Control', 'no-store');
          r.response.write(jsonEncode({'tables': games.map((g) => g.toJson()).toList()}));
          await r.response.close();
          return;
        }
        if (r.uri.path == '/tv' || r.uri.path == '/') {
          r.response.headers.contentType = ContentType.html;
          r.response.headers.set('Cache-Control', 'no-store');
          r.response.headers.set('Access-Control-Allow-Origin', '*');
          r.response.write(_tvHtml());
          await r.response.close();
          return;
        }
        if (WebSocketTransformer.isUpgradeRequest(r)) {
          try {
            final socket = await WebSocketTransformer.upgrade(r);
            socket.listen((data) {});
          } catch (_) {}
          return;
        }
        r.response.statusCode = HttpStatus.notFound;
        await r.response.close();
      });
    } catch (_) {}
  }

  String _tvHtml() => '''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billares Don Miguel</title><style>html,body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:hidden}header{height:12vh;display:flex;align-items:center;justify-content:center;font-size:4vw;font-weight:800}main{height:88vh;display:grid;grid-template-columns:repeat(5,1fr);gap:1.4vw;padding:1.2vw;box-sizing:border-box}.card{border-radius:1.2vw;padding:1.2vw;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 0 .7vw #000;font-size:1.55vw}.free{background:#16853d}.play{background:#b52323}.pending{background:#b8860b}.name{font-size:2.2vw;font-weight:800}.status{font-size:1.65vw;font-weight:700}.amount{font-size:2vw;font-weight:800}.small{font-size:1.25vw}.error{position:fixed;bottom:1vh;left:0;right:0;text-align:center;color:#aaa;font-size:1.1vw}</style></head><body><header>BILLARES DON MIGUEL</header><main id="tables"></main><div id="err" class="error"></div><script>const money=n=>'C$ '+Number(n||0).toFixed(2);const pad=n=>String(n).padStart(2,'0');function time(v){if(!v)return'--:--';const d=new Date(v);return pad(d.getHours())+':'+pad(d.getMinutes())}function dur(g){if(!g.start)return'00:00:00';const a=new Date(g.start).getTime(),b=g.end?new Date(g.end).getTime():Date.now(),s=Math.max(0,Math.floor((b-a)/1000));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}function draw(data){const root=document.getElementById('tables');root.innerHTML='';(data.tables||[]).forEach(g=>{const c=document.createElement('section');c.className='card '+(g.pending?'pending':g.active?'play':'free');const status=g.pending?'PENDIENTE DE PAGO':g.active?'EN JUEGO':'DISPONIBLE';c.innerHTML='<div><div class="name">MESA '+g.id+'</div><div class="status">'+status+'</div></div><div><div class="small">Inicio: '+time(g.start)+'</div><div class="small">Final: '+time(g.end)+'</div><div class="small">Tiempo: '+dur(g)+'</div><div class="amount">'+money(g.total)+'</div></div>';root.appendChild(c)})}async function refresh(){try{const r=await fetch('/state?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();draw(await r.json());document.getElementById('err').textContent=''}catch(e){document.getElementById('err').textContent='Esperando conexión con CENTRAL...'}}refresh();setInterval(refresh,1000);</script></body></html>''';
'''
          s = s[:start] + receiver + s[end:]
          start = s.index("  Future<void> linkTv() async {")
          end = s.index("\n  void sendTv()", start)
          link = r'''  Future<void> linkTv() async {
    if (!unlocked) return;
    try {
      final interfaces = await NetworkInterface.list(type: InternetAddressType.IPv4, includeLoopback: false);
      String? address;
      for (final network in interfaces) {
        for (final item in network.addresses) {
          if (!item.isLoopback) { address = item.address; break; }
        }
        if (address != null) break;
      }
      if (address == null) throw Exception('Sin IP de red');
      tvUrl = 'http://$address:$port/tv';
      tvOn = true;
      if (mounted) {
        await showDialog<void>(
          context: context,
          builder: (_) => AlertDialog(
            title: const Text('TV listo por red'),
            content: SelectableText('Conecta el televisor a la misma Wi-Fi que CENTRAL y abre esta dirección en el navegador del TV:\n\n$tvUrl\n\nLa pantalla se actualizará automáticamente.'),
            actions: [FilledButton(onPressed: () => Navigator.pop(context), child: const Text('Aceptar'))],
          ),
        );
      }
    } catch (_) {
      tvOn = false;
      if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('No se pudo iniciar la transmisión por red.')));
    }
    if (mounted) setState(() {});
  }
'''
          s = s[:start] + link + s[end:]
          p.write_text(s)
          PY
          dart format lib
      - name: Dependencias y analisis
        run: |
          set -e
          flutter pub get
          dart format lib
          flutter analyze --no-fatal-infos
      - name: Validar version y TV por red
        run: |
          set -e
          grep -F "const rates = <double>[120, 120, 100, 100, 70];" lib/main.dart
          grep -F "const defaultPin = '1234';" lib/main.dart
          grep -F "const currentBuild = 123;" lib/main.dart
          grep -F "const currentVersion = '1.2.3';" lib/main.dart
          grep -F "NetworkInterface.list" lib/main.dart
          grep -F "r.uri.path == '/tv'" lib/main.dart
          grep -F "r.uri.path == '/state'" lib/main.dart
          grep -F 'setInterval(refresh,1000)' lib/main.dart
      - name: Compilar APK release 123
        run: flutter build apk --release
      - name: Preparar APK publico
        run: cp build/app/outputs/flutter-apk/app-release.apk Billares-Don-Miguel-latest.apk
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-Update-v1.2.3-build123
          path: Billares-Don-Miguel-latest.apk
          if-no-files-found: error
      - name: Publicar release publico
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3-build123
          name: Billares Don Miguel v1.2.3 build 123
          body: Version 1.2.3 build 123 con transmisión TV por red local.
          files: Billares-Don-Miguel-latest.apk
          make_latest: true
